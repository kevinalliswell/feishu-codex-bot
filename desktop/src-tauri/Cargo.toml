[package]
name = "feishu-codex-desktop"
version = "0.2.0-beta.1"
description = "Feishu Codex macOS menu bar app"
authors = ["Feishu Codex contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "feishu_codex_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "feishu-codex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: npm run sidecar:build
      - name: Verify Node sidecar architecture and protocol
        run: |
          file desktop/src-tauri/binaries/feishu-codex-sidecar-aarch64-apple-darwin | grep arm64
          printf '%s\n' '{"version":1,"id":"ci-status","type":"status"}' '{"version":1,"id":"ci-stop","type":"shutdown"}' | desktop/src-tauri/binaries/feishu-codex-sidecar-aarch64-apple-darwin | grep '"id":"ci-stop","ok":true'

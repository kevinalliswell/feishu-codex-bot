name: Release macOS Desktop

on:
  push:
    tags: ["v0.2.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: secret-scan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
          key: release-aarch64
      - run: npm ci
      - run: npm run check
      - run: npm run sidecar:build
      - run: npm run native:build
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Verify bundled native tools
        run: |
          for tool_path in desktop/src-tauri/binaries/*-aarch64-apple-darwin; do
            file "$tool_path" | grep arm64
            if otool -L "$tool_path" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
              echo "Unexpected dynamic dependency in $tool_path" >&2
              exit 1
            fi
          done
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npx tauri
          args: --config desktop/src-tauri/tauri.conf.json --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Feishu Codex ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for changes. Unsigned beta builds require the documented Gatekeeper approval step.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
      - name: Generate license manifest and checksums
        run: |
          npm run licenses:generate -- --out artifacts/third-party-licenses.json
          mkdir -p artifacts
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0 | sort -z | xargs -0 shasum -a 256 > "$GITHUB_WORKSPACE/artifacts/SHA256SUMS"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          format: spdx-json
          output-file: artifacts/Feishu-Codex.spdx.json
          upload-artifact: false
      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/SHA256SUMS artifacts/third-party-licenses.json artifacts/Feishu-Codex.spdx.json --clobber
      - name: Update signed beta channel metadata
        if: contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f latest.json
          gh release view desktop-beta >/dev/null 2>&1 || gh release create desktop-beta --prerelease --title "Feishu Codex Beta 更新通道" --target "${{ github.sha }}"
          gh release upload desktop-beta "latest.json#latest.json" --clobber
      - name: Attest macOS release bundles
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
